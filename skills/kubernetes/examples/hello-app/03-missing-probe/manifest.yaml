# 03-missing-probe — the rollout-race lesson.
# Lesson: without a readinessProbe, a Pod enters Service endpoints the moment
# its container starts, before the app is accepting connections. During a
# rolling update, Pods are added to the Service while they're still booting
# → first requests get connection-refused or 502.
#
# The ONLY difference from 01-good: readinessProbe block removed from the
# container spec, and the container is wrapped in a startup delay so the race
# is observable (kicbase/echo-server starts fast; we add a sleep so the
# "ready too early" window is wide enough to see).
#
# Expected outcome after apply:
#   kubectl rollout status deployment/hello -n hello-app   # claims success in ~1s
#   kubectl get pods -n hello-app                           # READY 1/1 before app is up
#   kubectl port-forward -n hello-app svc/hello 8080:80 &
#   # Trigger a rollout: kubectl rollout restart deployment/hello -n hello-app
#   # Then rapid-fire curl during the rollout:
#   while true; do curl -sS -o /dev/null -w "%{http_code}\n" localhost:8080; done
#   # → mix of 200s and connection-refused during the rollout
#
# Then: /kubernetes debug "intermittent 502s during rollout"
---
apiVersion: v1
kind: Namespace
metadata:
  name: hello-app
  labels:
    app.kubernetes.io/name: hello-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-config
  namespace: hello-app
data:
  GREETING: "hello from kubernetes"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: hello-app
  labels:
    app.kubernetes.io/name: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: app
          image: kicbase/echo-server:1.0
          # Simulate a slow-starting app so the "ready too early" window is wide
          # enough to observe without exotic timing. In real learning, this is
          # what every JVM / large-cache app does naturally.
          command: ["/bin/sh", "-c"]
          args: ["sleep 15 && /echo-server"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hello-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          # readinessProbe deliberately omitted.
          # Fix would be to add this block, same as 01-good/:
          #   readinessProbe:
          #     httpGet: { path: /, port: http }
          #     periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: hello-app
spec:
  selector:
    app: hello
  ports:
    - port: 80
      targetPort: http
  type: ClusterIP
